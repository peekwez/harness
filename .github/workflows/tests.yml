# The engine's own test suite, on Linux. `harness-verify` runs the ship
# gate only, so without this job no test ran outside a developer's machine.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch git notes (provenance; test_verify reads them)
        run: git fetch origin 'refs/notes/*:refs/notes/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt -r docs/requirements.txt
      - name: Git identity for the toy repos
        run: |
          git config --global user.name "harness ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Run the suite
        run: python -m pytest tests/ -q
