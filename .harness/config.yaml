# harness self-hosting config — the plugin eats its own cooking.
schema: 1
gates:
  g3_mode: allow_with_findings
  g5_override: recorded_justification
  g5_similarity_threshold: 0.6
ensemble:
  trigger_confidence_below: 0.7
  samples: 3
languages:
  python: true
  typescript: false
  yaml: true
  hcl: false
telemetry:
  compaction_is_defect: false
