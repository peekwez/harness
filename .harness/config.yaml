# harness self-hosting config — the plugin eats its own cooking.
schema: 1
gates:
  g3_mode: allow_with_findings
  g5_similarity_threshold: 0.6
  exempt_paths: [".harness/", "adr/", ".github/", "tests/", "docs/", ".claude/", "explore/"]
languages:
  python: true
  typescript: false
  yaml: true
  hcl: false
review:
  ensemble: false
